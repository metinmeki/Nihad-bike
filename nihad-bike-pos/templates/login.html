<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIHAD BIKE — تسجيل الدخول</title>
<style>
  :root{ --bg:#F7F3EA; --ink:#1E2B22; --green:#5A9C74; --green-dark:#3E7856; --danger:#B54A3F; --card:#FFFFFF; --line:#E7E0CE; --muted:#8B9690; }
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:360px;
    box-shadow:0 12px 30px rgba(0,0,0,.06);text-align:center;}
  .login-card img{height:70px;margin-bottom:10px;}
  .login-card h1{font-size:19px;margin:0 0 2px;}
  .login-card .sub{font-size:12px;color:var(--muted);margin-bottom:24px;}
  .field{text-align:start;margin-bottom:14px;}
  .field label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px;}
  .field input{width:100%;border:1px solid #DCD4BC;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;outline:none;}
  .field input:focus{border-color:var(--green);}
  .error{background:#FBE9E5;color:var(--danger);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .submit-btn{width:100%;background:var(--green-dark);color:#fff;border:none;border-radius:8px;padding:11px;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;}
  .submit-btn:hover{opacity:.9;}
</style>
</head>
<body>
  <div class="login-card">
    <img src="/static/logo.png" alt="NIHAD BIKE">
    <h1>NIHAD BIKE</h1>
    <div class="sub">سجل المخزون والمبيعات</div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
      <div class="field">
        <label>اسم المستخدم</label>
        <input type="text" name="username" autofocus required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" name="password" required>
      </div>
      <button class="submit-btn" type="submit">تسجيل الدخول</button>
    </form>
  </div>
</body>
</html>
