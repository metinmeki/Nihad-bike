<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIHAD BIKE</title>
<style>
  :root{
    --bg:#F7F3EA; --ink:#1E2B22; --green:#5A9C74; --green-dark:#3E7856;
    --gold-soft:#E8D9A8; --danger:#B54A3F; --card:#FFFFFF; --line:#E7E0CE; --muted:#8B9690;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;}
  .header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{height:44px;width:auto;}
  .brand-name{font-size:18px;font-weight:700;}
  .brand-sub{font-size:11px;color:var(--muted);}
  .gear{width:100%;height:12px;display:flex;}
  .gear div{flex:1;height:12px;background:var(--green);}
  .gear div:nth-child(even){opacity:.35;}
  .low-badge{display:flex;align-items:center;gap:6px;font-size:12px;background:#FBE9E5;color:var(--danger);padding:6px 12px;border-radius:999px;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;padding:16px 20px 0;}
  .tab-btn{padding:9px 16px;border-radius:10px;font-size:14px;font-weight:600;border:none;cursor:pointer;background:#EFE9D9;color:var(--ink);}
  .tab-btn.active{background:var(--ink);color:var(--bg);}
  .content{padding:20px;}
  .grid{display:grid;gap:12px;}
  .grid.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .odometer{background:var(--ink);border-radius:10px;padding:12px 16px;}
  .odometer .label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-soft);margin-bottom:4px;}
  .odometer .value{font-family:"Consolas","Courier New",monospace;font-size:22px;color:#B9E8CB;}
  .odometer .value.danger{color:#E7897A;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;}
  .card-title{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--line);}
  .stat-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;flex:1;min-width:150px;}
  .stat-card .lbl{font-size:11px;text-transform:uppercase;color:var(--green-dark);font-weight:600;margin-bottom:6px;}
  .stat-card .val{font-size:19px;font-weight:700;}
  .stats-row{display:flex;gap:12px;flex-wrap:wrap;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:start;font-size:11px;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:2px solid var(--line);}
  td{padding:10px;border-bottom:1px solid #F0EBDC;font-size:14px;}
  .empty{padding:24px;text-align:center;color:var(--muted);font-size:14px;}
  input,select{border:1px solid #DCD4BC;border-radius:8px;padding:8px 10px;font-size:14px;background:#fff;color:var(--ink);width:100%;outline:none;font-family:inherit;}
  input:focus,select:focus{border-color:var(--green);}
  .btn{background:var(--green-dark);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center;width:100%;}
  .btn:hover{opacity:.9;}
  .btn.ghost{background:#EFE9D9;color:var(--ink);}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;border:none;cursor:pointer;}
  .form-row{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
  .form-row.two{flex-direction:row;gap:10px;}
  .two > *{flex:1;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.2);}
  .toast.danger{background:var(--danger);}
  .low-item{font-size:12px;background:#fff;color:var(--danger);padding:4px 10px;border-radius:999px;}
  .low-box{background:#FBE9E5;border:1px solid #F0C9C0;border-radius:12px;padding:14px;}
  .low-title{display:flex;align-items:center;gap:6px;color:var(--danger);font-weight:700;font-size:14px;margin-bottom:8px;}
  .search-box{display:flex;align-items:center;gap:8px;padding:10px;}
  .search-box input{border:none;padding:4px;}
  .result-row{width:100%;text-align:start;background:none;border:none;padding:8px 12px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid #F0EBDC;}
  .result-row:hover{background:var(--bg);}
  .two-col{display:grid;grid-template-columns:1fr;gap:16px;}
  @media(min-width:900px){.two-col{grid-template-columns:2fr 1fr;}.inv-col{grid-template-columns:1fr 2fr;}}
  .inv-col{display:grid;grid-template-columns:1fr;gap:16px;}
  .eye-btn{background:none;border:none;cursor:pointer;padding:2px 4px;color:var(--muted);font-size:14px;}
  .cost-hidden{letter-spacing:2px;color:var(--muted);}
  .th-with-eye{display:flex;align-items:center;gap:4px;}
  .client-row{width:100%;text-align:start;background:none;border:none;padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;border-bottom:1px solid #F0EBDC;font-size:14px;}
  .client-row:hover{background:var(--bg);}
  .menu-trigger{display:inline-flex;align-items:center;gap:8px;width:auto;}
  .mb-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;}
  .sidebar{position:fixed;top:0;inset-inline-start:0;height:100%;width:250px;background:var(--ink);color:#fff;z-index:31;
    box-shadow:-8px 0 24px rgba(0,0,0,.25);display:flex;flex-direction:column;padding:20px 0;overflow-y:auto;}
  .sidebar-brand{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px;}
  .sidebar-brand .name{font-size:17px;font-weight:700;color:#fff;}
  .sidebar-brand .sub{font-size:11px;color:var(--gold-soft);margin-top:2px;}
  .sidebar-item{display:flex;align-items:center;gap:10px;padding:13px 20px;background:none;border:none;cursor:pointer;
    color:#DCE6DF;font-size:14px;width:100%;text-align:start;border-inline-start:3px solid transparent;}
  .sidebar-item:hover{background:rgba(255,255,255,.06);}
  .sidebar-item.active{background:rgba(255,255,255,.08);color:#fff;font-weight:700;border-inline-start-color:var(--green);}
  .sidebar-icon{font-size:16px;width:20px;text-align:center;}
  .user-badge{display:flex;align-items:center;gap:8px;font-size:13px;}
  .role-tag{font-size:10px;padding:3px 8px;border-radius:999px;font-weight:700;}
  .role-tag.admin{background:#E8D9A8;color:#6B5A16;}
  .role-tag.cashier{background:#DCEFE3;color:var(--green-dark);}
  .logout-link{color:var(--muted);text-decoration:none;font-size:12px;}
  .logout-link:hover{color:var(--danger);}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <img src="/static/logo.png" alt="NIHAD BIKE">
    <div>
      <div class="brand-name">NIHAD BIKE</div>
      <div class="brand-sub">سجل المخزون والمبيعات</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <div id="lowBadge"></div>
    <div id="userBadge"></div>
  </div>
</div>
<div class="gear" id="gear"></div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"></div>
<div id="toastHost"></div>

<script>
const CURRENT_USER = {{ user | tojson }};
const AR = {
  tabs:{dashboard:"لوحة التحكم",inventory:"المخزون",sell:"بيع جديد",buy:"شراء جديد",clients:"العملاء",expenses:"المصاريف",users:"المستخدمين",debts:"الديون",settings:"الإعدادات"},
  lowStockBadge:n=>`${n} مواد منخفضة`,
  stat:{revenue:"إجمالي المبيعات",cost:"إجمالي الكلفة",profit:"صافي الربح",stockValue:"قيمة المخزون",
    itemsTracked:"عدد المواد",salesRecorded:"عدد المبيعات",purchasesLogged:"عدد المشتريات"},
  lowStockTitle:"مخزون منخفض — يحتاج تزويد", left:n=>`متبقي ${n}`,
  recentSales:"آخر المبيعات", noSales:'لا توجد مبيعات بعد. سجّلها من "بيع جديد".',
  col:{date:"التاريخ",items:"المواد",total:"المجموع",profit:"الربح",name:"الاسم",model:"الموديل",cost:"الشراء",price:"البيع",qty:"الكمية",client:"العميل"},
  inv:{addTitle:"إضافة مادة جديدة",editTitle:"تعديل المادة",namePh:"اسم المادة (مثال: دساكة بريك)",modelPh:"رقم الموديل",
    costPh:"سعر الشراء",pricePh:"سعر البيع",qtyPh:"الكمية في المخزون",save:"حفظ التعديلات",add:"إضافة",
    search:"بحث عن مادة...",empty:"لا توجد مواد بعد — أضف أول مادة.",fillAll:"أدخل الاسم والشراء والبيع والكمية",
    updated:"تم تعديل المادة",added:"تمت إضافة المادة",removed:"تم حذف المادة",edit:"تعديل",cancel:"إلغاء"},
  sale:{search:"ابحث عن مادة للبيع...",inStock:"متوفر",price:"سعر",cartEmpty:"السلة فارغة — ابحث عن مادة أعلاه.",
    total:"مجموع الفاتورة",profit:"الربح من هذه العملية",complete:"إتمام البيع",alreadyIn:"موجودة في السلة مسبقاً",
    outOfStock:n=>`${n} غير متوفرة حالياً`,pickOne:"أضف مادة واحدة على الأقل",onlyLeft:(max,n)=>`يوجد فقط ${max} من ${n}`,
    qtyMore:"يجب أن تكون الكمية أكثر من صفر",recorded:p=>`تم تسجيل البيع — الربح ${money(p)}`,recordedPlain:"تم تسجيل البيع بنجاح",
    noClient:"بدون عميل (زبون عابر)",paidPh:"المبلغ المدفوع",debtNeedsClient:"يجب اختيار عميل لتسجيل الدين",
    remainingDebt:n=>`سيبقى ديناً: ${money(n)}`,addressPh:"العنوان (اختياري، يظهر على الفاتورة)",
    previewPrint:"معاينة وطباعة",popupBlocked:"يرجى السماح بالنوافذ المنبثقة لهذا الموقع"},
  debts:{recordPayment:"تسجيل دفعة",amountPh:"المبلغ المدفوع",pay:"تسجيل الدفعة",empty:"لا توجد ديون مستحقة حالياً.",
    owes:"مدين بـ",totalDebts:"إجمالي الديون المستحقة",paymentRecorded:"تم تسجيل الدفعة",
    needAmount:"أدخل مبلغاً صحيحاً",history:"سجل الدفعات",noPayments:"لا توجد دفعات مسجلة بعد."},
  buy:{restock:"تزويد مادة موجودة",newItem:"شراء مادة جديدة",pick:"اختر مادة...",qtyBoughtPh:"الكمية المشتراة",
    costUnitPh:"سعر الشراء للقطعة",record:"تسجيل الشراء",needNamePrice:"أدخل الاسم وسعر البيع للمادة الجديدة",
    needQtyCost:"أدخل الكمية وسعر الشراء",needPick:"اختر مادة",restocked:(n,name)=>`تمت إضافة ${n} إلى ${name}`,
    stocked:name=>`تم تسجيل مادة جديدة: ${name}`},
  clients:{addTitle:"إضافة عميل جديد",namePh:"اسم العميل",phonePh:"رقم الهاتف",addressPh:"العنوان",add:"إضافة العميل",
    empty:"لا يوجد عملاء بعد.",search:"بحث عن عميل...",history:"سجل المشتريات",back:"رجوع",
    added:"تمت إضافة العميل",updated:"تم تعديل العميل",removed:"تم حذف العميل",edit:"تعديل",
    fillName:"أدخل اسم العميل",noHistory:"لا توجد مشتريات مسجلة لهذا العميل بعد."},
  expenses:{addTitle:"إضافة مصروف",descPh:"وصف المصروف (مثال: إيجار، كهرباء)",amountPh:"المبلغ",
    add:"إضافة المصروف",list:"سجل المصاريف",empty:"لا توجد مصاريف مسجلة بعد.",
    added:"تمت إضافة المصروف",removed:"تم حذف المصروف",fillAll:"أدخل الوصف والمبلغ",
    desc:"الوصف",amount:"المبلغ",total:"إجمالي المصاريف",netAfter:"صافي الربح بعد المصاريف"},
  users:{addTitle:"إضافة مستخدم جديد",usernamePh:"اسم المستخدم",passwordPh:"كلمة المرور (٤ أحرف على الأقل)",
    role:"الصلاحية",roleAdmin:"مدير",roleCashier:"كاشير",add:"إضافة المستخدم",empty:"لا يوجد مستخدمون بعد.",
    added:"تمت إضافة المستخدم",removed:"تم حذف المستخدم",fillAll:"أدخل اسم المستخدم وكلمة مرور 4 أحرف على الأقل",
    resetPassword:"تغيير كلمة المرور",newPasswordPrompt:"كلمة المرور الجديدة:",passwordUpdated:"تم تغيير كلمة المرور",
    cannotDeleteSelf:"لا يمكنك حذف حسابك الحالي",lastAdmin:"لا يمكن حذف آخر مدير"},
  settings:{title:"إعدادات المحل",addressPh:"عنوان المحل",phonePh:"رقم الهاتف",save:"حفظ الإعدادات",saved:"تم حفظ الإعدادات"},
  role:{admin:"مدير",cashier:"كاشير"}, logout:"تسجيل الخروج",
  noPermission:"هذا القسم متاح للمدير فقط.",
  receipt:{print:"طباعة الفاتورة"},
  loading:"جاري تحميل بيانات المتجر…", saveFail:"تعذر الحفظ — تحقق من الخادم المحلي",
};

let tab = "dashboard";
let db = {items:[],sales:[],purchases:[],clients:[],expenses:[],users:[],debtPayments:[],settings:{address:"",phone:""}};
let cart = [];
let costVisibleIds = new Set();
let selectedClientId = "";
let lastCompletedSaleId = null;
let viewingClientId = null;
let menuOpen = false;
const LOW_STOCK = 5;

function money(n){ n = Number(n)||0; return n.toLocaleString('en-US',{maximumFractionDigits:0}); }
function isAdmin(){ return CURRENT_USER && CURRENT_USER.role === "admin"; }
function clientDebt(clientId){
  const owed = db.sales.filter(s=>s.clientId===clientId).reduce((s,x)=>s+(x.total-x.paid),0);
  const paid = db.debtPayments.filter(p=>p.client_id===clientId).reduce((s,p)=>s+p.amount,0);
  return Math.max(0, owed - paid);
}
function totalDebts(){
  return db.clients.reduce((s,c)=>s+clientDebt(c.id),0);
}
function t(){ return AR; }
function esc(s){ const d=document.createElement("div"); d.textContent = s==null?"":s; return d.innerHTML; }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB') + " " + d.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'});
}

function showToast(msg, tone){
  const host = document.getElementById("toastHost");
  host.innerHTML = `<div class="toast ${tone==='danger'?'danger':''}">${esc(msg)}</div>`;
  setTimeout(()=>{ host.innerHTML=""; }, 2200);
}

async function loadState(){
  const res = await fetch("/api/state");
  db = await res.json();
}

function stats(){
  const revenue = db.sales.reduce((s,x)=>s+x.total,0);
  const profit = db.sales.reduce((s,x)=>s+x.profit,0);
  const cost = revenue - profit;
  const stockValue = db.items.reduce((s,x)=>s+x.qty*x.cost,0);
  const lowStock = db.items.filter(x=>x.qty<=LOW_STOCK);
  const totalExpenses = db.expenses.reduce((s,e)=>s+e.amount,0);
  const netAfterExpenses = profit - totalExpenses;
  return {revenue,profit,cost,stockValue,lowStock,totalExpenses,netAfterExpenses};
}

function renderHeader(){
  const st = stats();
  document.getElementById("lowBadge").innerHTML = st.lowStock.length
    ? `<div class="low-badge">&#9888; ${esc(t().lowStockBadge(st.lowStock.length))}</div>` : "";
  document.getElementById("gear").innerHTML = Array.from({length:24}).map(()=>"<div></div>").join("");
  if (CURRENT_USER){
    document.getElementById("userBadge").innerHTML = `
      <div class="user-badge">
        <span>${esc(CURRENT_USER.username)}</span>
        <span class="role-tag ${CURRENT_USER.role}">${esc(t().role[CURRENT_USER.role] || CURRENT_USER.role)}</span>
        <a class="logout-link" href="/logout">${esc(t().logout)}</a>
      </div>`;
  }
}

function renderTabs(){
  let tabs = [
    {id:"dashboard", label: t().tabs.dashboard, icon:"&#127968;"},
    {id:"inventory", label: t().tabs.inventory, icon:"&#128230;"},
    {id:"sell", label: t().tabs.sell, icon:"&#128722;"},
    {id:"buy", label: t().tabs.buy, icon:"&#128229;", adminOnly:true},
    {id:"clients", label: t().tabs.clients, icon:"&#128101;"},
    {id:"debts", label: t().tabs.debts, icon:"&#128179;"},
    {id:"expenses", label: t().tabs.expenses, icon:"&#128220;", adminOnly:true},
    {id:"users", label: t().tabs.users, icon:"&#128100;", adminOnly:true},
    {id:"settings", label: t().tabs.settings, icon:"&#9881;", adminOnly:true},
  ];
  if (!isAdmin()) tabs = tabs.filter(tb=>!tb.adminOnly);
  const current = tabs.find(x=>x.id===tab) || tabs[0];
  let sidebarHtml = "";
  if (menuOpen){
    sidebarHtml = `
      <div class="mb-overlay" onclick="closeMenu()"></div>
      <div class="sidebar">
        <div class="sidebar-brand">
          <div class="name">NIHAD BIKE</div>
          <div class="sub">سجل المخزون والمبيعات</div>
        </div>
        ${tabs.map(tb=>`<button class="sidebar-item ${tab===tb.id?'active':''}" onclick="selectTab('${tb.id}')">
          <span class="sidebar-icon">${tb.icon}</span> ${esc(tb.label)}
        </button>`).join("")}
      </div>`;
  }
  document.getElementById("tabs").innerHTML = `
    <button class="tab-btn menu-trigger active" onclick="toggleMenu(event)">&#9776; ${esc(current.label)}</button>
    ${sidebarHtml}`;
}

function toggleMenu(e){ e.stopPropagation(); menuOpen = !menuOpen; render(); }
function closeMenu(){ menuOpen = false; render(); }
function selectTab(id){
  tab = id; menuOpen = false; cart = []; viewingClientId = null; lastCompletedSaleId = null;
  if (id === "users" && isAdmin()){ loadUsers().then(render); } else { render(); }
}

function render(){
  const adminOnlyTabs = ["buy","expenses","users","settings"];
  if (!isAdmin() && adminOnlyTabs.includes(tab)) tab = "dashboard";

  const active = document.activeElement;
  const activeId = active && active.id;
  const canHaveSelection = active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA");
  const selStart = canHaveSelection ? active.selectionStart : null;
  const selEnd = canHaveSelection ? active.selectionEnd : null;

  renderHeader();
  renderTabs();
  const c = document.getElementById("content");
  if (tab==="dashboard") c.innerHTML = renderDashboard();
  if (tab==="inventory") c.innerHTML = renderInventory();
  if (tab==="sell") c.innerHTML = renderSell();
  if (tab==="buy") c.innerHTML = renderBuy();
  if (tab==="clients") c.innerHTML = renderClients();
  if (tab==="debts") c.innerHTML = renderDebts();
  if (tab==="expenses") c.innerHTML = renderExpenses();
  if (tab==="users") c.innerHTML = renderUsers();
  if (tab==="settings") c.innerHTML = renderSettings();
  if (tab==="inventory") bindInventory();
  if (tab==="sell") bindSell();
  if (tab==="buy") bindBuy();
  if (tab==="clients") bindClients();
  if (tab==="debts") bindDebts();
  if (tab==="expenses") bindExpenses();
  if (tab==="users") bindUsers();
  if (tab==="settings") bindSettings();

  if (activeId){
    const el = document.getElementById(activeId);
    if (el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")){
      el.focus();
      if (selStart !== null && selStart !== undefined && el.setSelectionRange){
        try { el.setSelectionRange(selStart, selEnd); } catch(e){}
      }
    }
  }
}

function odometer(value,label,tone){
  return `<div class="odometer"><div class="label">${esc(label)}</div>
    <div class="value ${tone==='danger'?'danger':''}">${money(Math.round(value))} <span style="font-size:11px;opacity:.6;">IQD</span></div></div>`;
}

function renderDashboard(){
  const s = stats();
  const admin = isAdmin();
  const recent = [...db.sales].reverse().slice(0,6);
  const rows = recent.length ? recent.map(sale=>{
    const items = sale.lines.map(l=>`${esc(l.name)} ×${l.qty}`).join(", ");
    return `<tr><td>${fmtDate(sale.date)}</td>
      <td>${esc(sale.clientName) || '—'}</td>
      <td>${items}</td><td>${money(sale.total)}</td>
      ${admin ? `<td style="color:var(--green-dark);font-weight:700;">${money(sale.profit)}</td>` : ""}
      <td><button class="btn-sm ghost" onclick="printSale(${sale.id})">&#128438;</button></td></tr>`;
  }).join("") : `<div class="empty">${esc(t().noSales)}</div>`;

  return `
  <div class="grid stats" style="margin-bottom:16px;">
    ${odometer(s.revenue, t().stat.revenue)}
    ${odometer(totalDebts(), t().debts.totalDebts, 'danger')}
    ${admin ? odometer(s.cost, t().stat.cost, 'danger') : ""}
    ${admin ? odometer(s.profit, t().stat.profit) : ""}
    ${admin ? odometer(s.stockValue, t().stat.stockValue) : ""}
    ${admin ? odometer(s.totalExpenses, t().expenses.total, 'danger') : ""}
    ${admin ? odometer(s.netAfterExpenses, t().expenses.netAfter) : ""}
  </div>
  <div class="stats-row" style="margin-bottom:16px;">

function renderSell(){
  const query = window.__sellQuery || "";
  const results = query ? db.items.filter(i=>(i.name+" "+(i.model||"")).toLowerCase().includes(query.toLowerCase())) : db.items;
  const resultsHtml = results.length ? `<div class="card" style="margin-top:8px;max-height:340px;overflow-y:auto;">${results.map(i=>`
    <button class="result-row" onclick="addToCart(${i.id})">

      <span style="color:${i.qty<=LOW_STOCK?'var(--danger)':'var(--green-dark)'};">${i.qty} ${esc(t().sale.inStock)} · ${money(i.price)} IQD</span>
    </button>`).join("")}</div>` : "";

  const cartRows = cart.length ? cart.map((l,idx)=>`
    <tr>
      <td>${esc(l.name)}</td>
      <td><input type="number" min="1" max="${l.maxQty}" value="${l.qty}" style="width:70px;" onchange="updateCartQty(${idx}, this.value)"></td>
      <td><input type="number" value="${l.price}" style="width:100px;" onchange="updateCartPrice(${idx}, this.value)"></td>
      <td>${money(l.price*l.qty)}</td>
      <td><button onclick="removeCartLine(${idx})" style="background:none;border:none;cursor:pointer;color:var(--danger);">&#128465;</button></td>
    </tr>`).join("") : `<div class="empty">${esc(t().sale.cartEmpty)}</div>`;

  const total = cart.reduce((s,l)=>s+Number(l.price||0)*Number(l.qty||0),0);
  const profit = cart.reduce((s,l)=>s+(Number(l.price||0)-Number(l.cost||0))*Number(l.qty||0),0);
  if (!window.__paidManuallySet) window.__paidAmount = total;
  const paidAmount = Number(window.__paidAmount) || 0;
  const remaining = Math.max(0, total - paidAmount);
  const selectedClient = db.clients.find(c=>String(c.id)===String(selectedClientId));
  if (!window.__addressManuallySet) window.__saleAddress = selectedClient ? (selectedClient.address || "") : "";
  const saleAddress = window.__saleAddress || "";

  const clientOptions = `<option value="">${esc(t().sale.noClient)}</option>` +
    db.clients.map(c=>`<option value="${c.id}" ${String(c.id)===String(selectedClientId)?'selected':''}>${esc(c.name)}${c.phone ? ' — '+esc(c.phone) : ''}</option>`).join("");

  return `
  <div class="two-col">
    <div>
      <div class="card" style="padding:12px;">
        <select id="sellClient" style="margin-bottom:10px;">${clientOptions}</select>
        <input id="sellAddress" placeholder="${esc(t().sale.addressPh)}" value="${esc(saleAddress)}" style="margin-bottom:10px;">
        <div class="search-box" style="padding:0;">&#128269; <input id="sellSearch" placeholder="${esc(t().sale.search)}" value="${esc(query)}"></div>
        ${resultsHtml}
      </div>
      <div class="card" style="margin-top:12px;">
        ${cart.length ? `<table><thead><tr><th>${esc(t().col.items)}</th><th>${esc(t().col.qty)}</th><th>${esc(t().sale.price)}</th><th>${esc(t().col.total)}</th><th></th></tr></thead><tbody>${cartRows}</tbody></table>` : cartRows}
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:12px;">
      ${odometer(total, t().sale.total)}
      ${isAdmin() ? odometer(profit, t().sale.profit) : ""}
      <div class="card" style="padding:12px;">
        <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;">${esc(t().sale.paidPh)}</label>
        <input id="sellPaid" type="number" value="${paidAmount}" max="${total}" min="0">
        ${remaining > 0 ? `<div style="color:var(--danger);font-size:12px;margin-top:6px;">${esc(t().sale.remainingDebt(remaining))}${!selectedClientId ? " — " + esc(t().sale.debtNeedsClient) : ""}</div>` : ""}
      </div>
      <button class="btn" onclick="checkout()">&#128722; ${esc(t().sale.complete)}</button>
      ${cart.length ? `<button class="btn ghost" onclick="printPreview()">&#128438; ${esc(t().sale.previewPrint)}</button>` : ""}
      ${lastCompletedSaleId ? `<button class="btn ghost" onclick="printSale(${lastCompletedSaleId})">&#128438; ${esc(t().receipt.print)}</button>` : ""}

function addToCart(itemId){
  const item = db.items.find(i=>i.id===itemId);
  if (item.qty<=0){ showToast(t().sale.outOfStock(item.name), "danger"); return; }
  if (cart.find(l=>l.itemId===itemId)){ showToast(t().sale.alreadyIn); return; }
  lastCompletedSaleId = null;
  cart.push({itemId:item.id, name:item.name, qty:1, price:item.price, cost:item.cost, maxQty:item.qty});
  window.__sellQuery = "";
  render();
}
function updateCartQty(idx, val){ cart[idx].qty = val; render(); }
function updateCartPrice(idx, val){ cart[idx].price = val; render(); }
function removeCartLine(idx){ cart.splice(idx,1); render(); }

async function checkout(){
  if (!cart.length){ showToast(t().sale.pickOne, "danger"); return; }
  for (const l of cart){
    if (Number(l.qty) > l.maxQty){ showToast(t().sale.onlyLeft(l.maxQty, l.name), "danger"); return; }
    if (Number(l.qty) <= 0){ showToast(t().sale.qtyMore, "danger"); return; }
  }
  const total = cart.reduce((s,l)=>s+Number(l.price||0)*Number(l.qty||0),0);
  const paid = window.__paidManuallySet ? Number(window.__paidAmount) || 0 : total;
  if (paid < total && !selectedClientId){ showToast(t().sale.debtNeedsClient, "danger"); return; }
  const payload = { lines: cart.map(l=>({itemId:l.itemId, qty:l.qty, price:l.price})), clientId: selectedClientId || null, paid, address: window.__saleAddress || "" };
  const res = await fetch("/api/sales", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
  const data = await res.json();
  if (data.error){ showToast(data.error, "danger"); return; }
  showToast(isAdmin() ? t().sale.recorded(data.profit) : t().sale.recordedPlain);
  lastCompletedSaleId = data.id;
  cart = [];
  selectedClientId = "";
  window.__paidAmount = null;
  window.__paidManuallySet = false;
  window.__saleAddress = "";
  window.__addressManuallySet = false;
  await loadState(); render();
}

function printSale(id){ window.open(`/receipt/${id}`, "_blank"); }

async function printPreview(){
  if (!cart.length) return;
  const total = cart.reduce((s,l)=>s+Number(l.price||0)*Number(l.qty||0),0);
  const paid = window.__paidManuallySet ? Number(window.__paidAmount) || 0 : total;
  const payload = {
    lines: cart.map(l=>({itemId:l.itemId, qty:l.qty, price:l.price})),
    clientId: selectedClientId || null,
    paid,
    address: window.__saleAddress || ""
  };
  const res = await fetch("/receipt-preview", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(payload)});
  const html = await res.text();
  const win = window.open("", "_blank");
  if (!win){ showToast(t().sale.popupBlocked, "danger"); return; }
  win.document.write(html);
  win.document.close();
}

  const rows = indebted.length ? indebted.map(c=>`
    <div class="client-row" style="align-items:center;">
      <span style="flex:1;">${esc(c.name)} <span style="color:var(--muted);">${esc(c.phone)||''}</span></span>
      <span style="color:var(--danger);font-weight:700;margin-inline-end:12px;">${money(c.debt)} IQD</span>
      <button class="btn-sm" style="background:var(--green-dark);color:#fff;" onclick="promptDebtPayment(${c.id}, ${c.debt})">${esc(t().debts.recordPayment)}</button>
    </div>`).join("") : `<div class="empty">${esc(t().debts.empty)}</div>`;

  return `
  <div>
    <div style="margin-bottom:16px;">${odometer(total, t().debts.totalDebts, 'danger')}</div>
    <div class="card">
      <div class="card-title">${esc(t().tabs.debts)}</div>
      ${rows}
    </div>
  </div>`;
}

function bindDebts(){}

async function promptDebtPayment(clientId, currentDebt){
  const input = prompt(`${t().debts.amountPh} (${t().debts.owes} ${money(currentDebt)} IQD):`, currentDebt);
  if (input === null) return;
  const amount = Number(input);
  if (!amount || amount <= 0){ showToast(t().debts.needAmount, "danger"); return; }
  const res = await fetch("/api/debt-payments", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({clientId, amount})});
  const data = await res.json();
  if (data.error){ showToast(data.error, "danger"); return; }
  showToast(t().debts.paymentRecorded);
  await loadState(); render();
}

function renderExpenses(){
  const totalExpenses = db.expenses.reduce((s,e)=>s+e.amount,0);
  const rows = db.expenses.length ? [...db.expenses].reverse().map(e=>`
    <tr>
      <td>${fmtDate(e.date)}</td>
      <td>${esc(e.description)}</td>
      <td>${money(e.amount)}</td>
      <td><button class="btn-sm" style="background:#FBE9E5;color:var(--danger);" onclick="deleteExpense(${e.id})">&#128465;</button></td>
    </tr>`).join("") : `<div class="empty">${esc(t().expenses.empty)}</div>`;

  return `
  <div class="inv-col">
    <form class="card" id="expenseForm" style="padding:16px;">
      <div style="font-weight:700;margin-bottom:10px;">${esc(t().expenses.addTitle)}</div>
      <div class="form-row">
        <input id="e_desc" placeholder="${esc(t().expenses.descPh)}">
        <input id="e_amount" type="number" placeholder="${esc(t().expenses.amountPh)}">
      </div>
      <button class="btn" type="submit">+ ${esc(t().expenses.add)}</button>
    </form>
    <div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
        <span>${esc(t().expenses.list)}</span>
        <span style="color:var(--danger);font-weight:700;">${money(totalExpenses)} IQD</span>
      </div>
      ${db.expenses.length ? `<table><thead><tr><th>${esc(t().col.date)}</th><th>${esc(t().expenses.desc)}</th><th>${esc(t().expenses.amount)}</th><th></th></tr></thead><tbody>${rows}</tbody></table>` : rows}
    </div>
  </div>`;
}

function bindExpenses(){
  document.getElementById("expenseForm").onsubmit = async e => {
    e.preventDefault();
    const description = document.getElementById("e_desc").value.trim();
    const amount = document.getElementById("e_amount").value;
    if (!description || !amount || Number(amount) <= 0){ showToast(t().expenses.fillAll, "danger"); return; }
    const res = await fetch("/api/expenses", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({description, amount})});
    const data = await res.json();
    if (data.error){ showToast(data.error, "danger"); return; }
    showToast(t().expenses.added);
    await loadState(); render();
  };
}

async function deleteExpense(id){
  await fetch(`/api/expenses/${id}`, {method:"DELETE"});
  showToast(t().expenses.removed);
  await loadState(); render();
}

async function loadUsers(){
  const res = await fetch("/api/users");
  if (res.ok) db.users = await res.json();
}

function renderUsers(){
  if (!isAdmin()){
    return `<div class="empty">${esc(t().noPermission)}</div>`;
  }
  const rows = db.users.length ? db.users.map(u=>`
    <div class="client-row">
      <span style="flex:1;">${esc(u.username)} <span class="role-tag ${u.role}" style="margin-inline-start:8px;">${esc(t().role[u.role] || u.role)}</span></span>
      <div style="display:flex;gap:6px;">
        <button class="btn-sm ghost" onclick="resetUserPassword(${u.id})">${esc(t().users.resetPassword)}</button>
        <button class="btn-sm" style="background:#FBE9E5;color:var(--danger);" onclick="deleteUser(${u.id})">&#128465;</button>
      </div>
    </div>`).join("") : `<div class="empty">${esc(t().users.empty)}</div>`;

  return `
  <div class="inv-col">
    <form class="card" id="userForm" style="padding:16px;">
      <div style="font-weight:700;margin-bottom:10px;">${esc(t().users.addTitle)}</div>
      <div class="form-row">
        <input id="u_username" placeholder="${esc(t().users.usernamePh)}">
        <input id="u_password" type="password" placeholder="${esc(t().users.passwordPh)}">
        <select id="u_role">
          <option value="cashier">${esc(t().users.roleCashier)}</option>
          <option value="admin">${esc(t().users.roleAdmin)}</option>
        </select>
      </div>
      <button class="btn" type="submit">+ ${esc(t().users.add)}</button>
    </form>
    <div class="card">
      ${rows}
    </div>
  </div>`;
}

function bindUsers(){
  const form = document.getElementById("userForm");
  if (!form) return;
  form.onsubmit = async e => {
    e.preventDefault();
    const username = document.getElementById("u_username").value.trim();
    const password = document.getElementById("u_password").value;
    const role = document.getElementById("u_role").value;
    if (!username || password.length < 4){ showToast(t().users.fillAll, "danger"); return; }
    const res = await fetch("/api/users", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({username, password, role})});
    const data = await res.json();
    if (data.error){ showToast(data.error, "danger"); return; }
    showToast(t().users.added);
    await loadUsers(); render();
  };
}

async function deleteUser(id){
  const res = await fetch(`/api/users/${id}`, {method:"DELETE"});
  const data = await res.json();
  if (data.error){ showToast(data.error, "danger"); return; }
  showToast(t().users.removed);
  await loadUsers(); render();
}

async function resetUserPassword(id){
  const pwd = prompt(t().users.newPasswordPrompt);
  if (!pwd) return;
  if (pwd.length < 4){ showToast(t().users.fillAll, "danger"); return; }
  const res = await fetch(`/api/users/${id}/password`, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({password:pwd})});
  const data = await res.json();
  if (data.error){ showToast(data.error, "danger"); return; }
  showToast(t().users.passwordUpdated);
}

function renderSettings(){
  const s = db.settings || {address:"", phone:""};
  return `
  <div style="max-width:480px;">
    <form class="card" id="settingsForm" style="padding:16px;">
      <div style="font-weight:700;margin-bottom:10px;">${esc(t().settings.title)}</div>
      <div class="form-row">
        <input id="s_address" placeholder="${esc(t().settings.addressPh)}" value="${esc(s.address)}">
        <input id="s_phone" placeholder="${esc(t().settings.phonePh)}" value="${esc(s.phone)}">
      </div>
      <button class="btn" type="submit">${esc(t().settings.save)}</button>
    </form>
  </div>`;
}

function bindSettings(){
  document.getElementById("settingsForm").onsubmit = async e => {
    e.preventDefault();
    const address = document.getElementById("s_address").value.trim();
    const phone = document.getElementById("s_phone").value.trim();
    const res = await fetch("/api/settings", {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify({address, phone})});
    db.settings = await res.json();
    showToast(t().settings.saved);
  };
}

(async function init(){
  document.getElementById("content").innerHTML = `<div class="empty">${esc(t().loading)}</div>`;
  await loadState();
  render();
})();
</script>
</body>
</html>
